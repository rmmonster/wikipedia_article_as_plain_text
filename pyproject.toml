[project]
name = "wikipedia_plain_text"
version = "0.1.0"
description = "Wikipedia article as plain text"
authors = [
    {name = "Philipp Seelig",email = "git.phil@daxbau.net"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
development = [
    "mypy (>=2.1.0,<3.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.15.18,<0.16.0)",
    "isort (>=8.0.1,<9.0.0)"
]

[tool.poetry.scripts]
download = "wikipedia_plain_text.wikipedia_plain_text:main"
